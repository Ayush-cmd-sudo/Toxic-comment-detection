<!DOCTYPE html>
<html>

<head>
    <title>Toxic Comment Detector</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        /* Glass Card */
        .card {
            width: 420px;
            padding: 35px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: white;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h2 {
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 15px;
            border: none;
            outline: none;
            border-radius: 12px;
            resize: none;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        textarea::placeholder {
            color: #666;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            background: linear-gradient(90deg, #ff7a18, #ffb347);
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .normal {
            color: #00ffae;
        }

        .offensive {
            color: #ffd166;
        }

        .hate {
            color: #ff4d6d;
        }

        footer {
            margin-top: 15px;
            font-size: 12px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>🤖 Toxic Comment Detector</h2>

        <textarea id="text" placeholder="Type a comment..."></textarea>
        <button onclick="predict()">Analyze Comment</button>

        <div id="output" class="result">Waiting for input...</div>
        <footer>AI powered text moderation</footer>
    </div>

    <script>
        async function predict() {
            const text = document.getElementById("text").value;

            if (text.trim() === "") {
                alert("Please enter text");
                return;
            }

            const response = await fetch("http://127.0.0.1:8000/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text: text })
            });

            const data = await response.json();
            const outputDiv = document.getElementById("output");

            outputDiv.innerText = "Prediction: " + data.prediction;
            outputDiv.className = "result";

            if (data.prediction.toLowerCase().includes("hate"))
                outputDiv.classList.add("hate");
            else if (data.prediction.toLowerCase().includes("offensive"))
                outputDiv.classList.add("offensive");
            else
                outputDiv.classList.add("normal");
        }
    </script>

</body>

</html>
